name: Patch Android with Shorebird

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing Shorebird release version, for example 1.0.0+1
        required: true
        type: string
      track:
        description: Patch rollout track
        required: true
        default: staging
        type: choice
        options:
          - staging
          - stable

concurrency:
  group: shorebird-patch-android-${{ inputs.release_version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.9
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/mconnect-chatbot-upload.jks
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  patch:
    name: Build and publish patch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Validate configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HR_API_BASE_URL: ${{ vars.HR_API_BASE_URL }}
          AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
        run: |
          test -n "$SHOREBIRD_TOKEN" || { echo "Missing SHOREBIRD_TOKEN" >&2; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD" >&2; exit 1; }
          test -n "$HR_API_BASE_URL" || { echo "Missing HR_API_BASE_URL variable" >&2; exit 1; }
          test -n "$AGENT_API_BASE_URL" || { echo "Missing AGENT_API_BASE_URL variable" >&2; exit 1; }

      - name: Create app environment
        env:
          HR_API_BASE_URL: ${{ vars.HR_API_BASE_URL }}
          AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
        run: |
          printf 'HR_API_BASE_URL=%s\n' "$HR_API_BASE_URL" > .env
          printf 'AGENT_API_BASE_URL=%s\n' "$AGENT_API_BASE_URL" >> .env

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

      - name: Create Shorebird patch
        id: shorebird-patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          args: --track=${{ inputs.track }}

      - name: Write summary
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          TRACK: ${{ inputs.track }}
          PATCH_NUMBER: ${{ steps.shorebird-patch.outputs.patch-number }}
        run: |
          {
            echo "## Shorebird Android patch"
            echo "- Release: $RELEASE_VERSION"
            echo "- Patch: $PATCH_NUMBER"
            echo "- Track: $TRACK"
          } >> "$GITHUB_STEP_SUMMARY"
