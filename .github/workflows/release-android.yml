name: Release Android APK

on:
  push:
    tags:
      - internal-v*
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 1.0.0+1
        required: true
        type: string

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.9
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/mconnect-chatbot-upload.jks
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  release:
    name: Build, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/internal-v* ]]; then
            VERSION="${GITHUB_REF_NAME#internal-v}"
          else
            VERSION="$MANUAL_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "build_name=${VERSION%%+*}"
            echo "build_number=${VERSION##*+}"
            echo "tag=internal-v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HR_API_BASE_URL: ${{ vars.HR_API_BASE_URL }}
          AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD" >&2; exit 1; }
          test -n "$HR_API_BASE_URL" || { echo "Missing HR_API_BASE_URL variable" >&2; exit 1; }
          test -n "$AGENT_API_BASE_URL" || { echo "Missing AGENT_API_BASE_URL variable" >&2; exit 1; }

      - name: Create app environment
        env:
          HR_API_BASE_URL: ${{ vars.HR_API_BASE_URL }}
          AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
        run: |
          printf 'HR_API_BASE_URL=%s\n' "$HR_API_BASE_URL" > .env
          printf 'AGENT_API_BASE_URL=%s\n' "$AGENT_API_BASE_URL" >> .env

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >-
          flutter build apk
          --release
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Prepare release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "mconnect-chatbot-$VERSION.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: mconnect-chatbot-${{ steps.version.outputs.version }}
          path: mconnect-chatbot-${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="mconnect-chatbot-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "MConnect Chatbot $VERSION" \
              --notes "Internal Android APK." \
              --prerelease
          fi

      - name: Write summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Android internal release"
            echo "- Version: $VERSION"
            echo "- Package: com.irohasu.mconnect.chatbot"
          } >> "$GITHUB_STEP_SUMMARY"
